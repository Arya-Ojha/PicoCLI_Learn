[project]
name = "pico-ai"
version = "0.1.0"
description = "LLM abstraction and protocol normalisation."
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_ai"]
