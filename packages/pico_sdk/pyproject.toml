[project]
name = "pico-sdk"
version = "0.1.0"
description = "Workbench library API and tool/provider registration."
requires-python = ">=3.12"
dependencies = ["pico-core", "pico-ai", "pydantic>=2", "httpx>=0.27", "pymupdf>=1.24", "pillow>=10"]

[project.scripts]
pico = "pico_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pico_sdk"]

[tool.uv.sources]
pico-core = { workspace = true }
pico-ai = { workspace = true }
